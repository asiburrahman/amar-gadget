name: Marketplace verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  verify:
    name: PostgreSQL ${{ matrix.postgres }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: audit_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: audit_ci_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_ci -d audit_ci_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://audit_ci:disposable_ci_only@127.0.0.1:5432/audit_ci_control
      DATABASE_URL: postgresql://audit_ci:disposable_ci_only@127.0.0.1:5432/audit_ci_control
      DIRECT_URL: postgresql://audit_ci:disposable_ci_only@127.0.0.1:5432/audit_ci_control
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prisma schema validation
        run: npx prisma validate
      - name: Unit, real PostgreSQL, migrations and seed (no skipped tests)
        run: npm run test:isolated
      - name: Native ingress and fixture readiness tests
        run: npm run test:native
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production and standalone build
        run: npm run build
      - name: Compiled database, provider and outage checks
        run: |
          npm run smoke:reliability-collections
          npm run smoke:reliability-outages
          npm run smoke:otp-clock
          npm run smoke:refunds
          npm run smoke:site-content
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Checkout, upload recovery, content publication and navigation in real browsers
        run: npm run test:browser
      - name: Retain synthetic test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-pg${{ matrix.postgres }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
